name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (domain logic)
        run: npm test
      - name: Every module parses
        run: for f in $(find assets/js -name '*.js'); do node --check "$f" || exit 1; done
